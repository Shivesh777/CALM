<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<script src="node_modules/d3/dist/d3.min.js"></script>
<script src="node_modules/katex/dist/katex.min.js"></script>
<script src="figlib.js"></script>
<script src="data/kappa.js"></script>
<script src="data/collapse.js"></script>
</head><body>
<div id="fig"></div>
<script>
whenFonts(() => {
const W = 624, H = 196;
const svg = makeSvg(W, H, "Left: the measured overlap factor grows roughly like h before saturating. Middle and right: simulated excess loss of fixed-share exponential weights; against eta the curves for h = 1, 8, 32 are far apart, against eta times kappa_h they nearly coincide.");

function frame(g, x, y, w, h, xs, ys, xticks, yticks, xfmt, yfmt) {
  g.append("g").attr("class", "grid").attr("transform", `translate(${x},0)`).call(d3.axisLeft(ys).tickValues(yticks).tickSize(-w).tickFormat(""));
  g.append("g").attr("class", "axis").attr("transform", `translate(${x},0)`).call(d3.axisLeft(ys).tickValues(yticks).tickSize(3).tickFormat(yfmt));
  g.append("g").attr("class", "axis").attr("transform", `translate(0,${y + h})`).call(d3.axisBottom(xs).tickValues(xticks).tickSize(3).tickFormat(xfmt));
}

/* ---------------- (a) measured overlap factor */
{
  const K = window.FIG_KAPPA;
  const g = svg.append("g");
  panelTitle(g, 0, 14, "a", "Measured overlap factor");
  const m = { l: 30, t: 30, w: 168, h: 128 };
  const x = d3.scaleLinear().domain([0, 96]).range([m.l, m.l + m.w]);
  const y = d3.scaleLinear().domain([0, 70]).range([m.t + m.h, m.t]);
  frame(g, m.l, m.t, m.w, m.h, x, y, [1, 24, 48, 72, 96], [0, 20, 40, 60], d3.format("d"), d3.format("d"));
  // kappa = h (the value CALM uses), clipped to the panel
  g.append("line").attr("x1", x(1)).attr("y1", y(1)).attr("x2", x(70)).attr("y2", y(70)).attr("stroke", css("--calm"))
    .attr("stroke-width", 1.6).attr("stroke-dasharray", "5 3");
  mathAt(x(52), y(66), "\\kappa_h=h", { size: 9.5, anchor: "end", color: css("--calm") });
  const greys = { ECL: "#3d3c39", ETTh2: "#5c5b57", Weather: "#7d7c77", ETTm1: "#9a998f", Traffic: "#b3b2a9" };
  Object.entries(K).forEach(([ds, pts]) => {
    const p = pts.map(([h, v]) => [x(h), y(v)]);
    g.append("path").attr("d", d3.line()(p)).attr("fill", "none").attr("stroke", greys[ds]).attr("stroke-width", 1.6).attr("stroke-linejoin", "round");
    const last = p[p.length - 1];
    g.append("text").attr("class", "t-tiny").attr("x", last[0] + 3).attr("y", last[1] + 3).style("fill", "#52514e").text(ds);
  });
  g.append("text").attr("class", "t-tiny").attr("x", m.l + m.w / 2).attr("y", m.t + m.h + 25).attr("text-anchor", "middle").text("horizon h");
  mathAt(m.l - 26, m.t - 6, "\\hat\\kappa_h", { size: 9.5, color: "#52514e" });
}

/* ---------------- (b, c) simulated excess loss vs eta and vs eta*kappa */
{
  const C = window.FIG_COLLAPSE;
  const cols = [css("--b250"), css("--b450"), css("--b650")];
  const allY = C.rows.flatMap(r => r.curve);
  const ys = d3.scaleLinear().domain([0, 0.32]).range([30 + 128, 30]);
  const panels = [
    { x0: 236, letter: "b", title: "Excess loss vs. learning rate", key: "eta", lab: "\\eta" },
    { x0: 436, letter: "c", title: "… vs. η κ", key: "etak", lab: "\\eta\\,\\kappa_h" },
  ];
  panels.forEach(P => {
    const g = svg.append("g");
    const t = panelTitle(g, P.x0, 14, P.letter, P.key === "eta" ? P.title : null);
    if (P.key !== "eta") {
      const tx = g.append("text").attr("class", "t-title").attr("x", P.x0 + 13).attr("y", 14).text("Same curves vs.");
      mathAt(P.x0 + 13 + tx.node().getComputedTextLength() + 4, 14, "\\eta\\,\\kappa_h", { size: 10.4 });
    }
    const m = { l: P.x0 + 28, t: 30, w: 156, h: 128 };
    const xs = d3.scaleLog().domain(P.key === "eta" ? [0.001, 4] : [0.001, 40]).range([m.l, m.l + m.w]);
    const ysP = d3.scaleLinear().domain([0, 0.32]).range([m.t + m.h, m.t]);
    const xt = P.key === "eta" ? [0.001, 0.01, 0.1, 1] : [0.001, 0.01, 0.1, 1, 10];
    frame(g, m.l, m.t, m.w, m.h, xs, ysP, xt, [0, 0.1, 0.2, 0.3], d => d >= 1 ? d3.format("d")(d) : d3.format("~g")(d), d3.format(".1f"));
    C.rows.forEach((r, i) => {
      const p = C.etas.map((e, j) => [xs(P.key === "eta" ? e : e * r.kappa), ysP(r.curve[j])]).filter(q => q[0] <= m.l + m.w + 0.5);
      g.append("path").attr("d", d3.line().curve(d3.curveMonotoneX)(p)).attr("fill", "none").attr("stroke", cols[i]).attr("stroke-width", 2)
        .attr("stroke-linecap", "round");
      // mark the minimum
      const j = r.curve.indexOf(d3.min(r.curve));
      const mxp = xs(P.key === "eta" ? C.etas[j] : C.etas[j] * r.kappa);
      g.append("circle").attr("cx", mxp).attr("cy", ysP(r.curve[j])).attr("r", 3.6).attr("fill", cols[i]).attr("stroke", "#fff").attr("stroke-width", 1.4);
    });
    g.append("text").attr("class", "t-tiny").attr("x", m.l - 24).attr("y", m.t - 6).text("excess loss");
    mathAt(m.l + m.w / 2, m.t + m.h + 26, P.lab, { size: 9.5, anchor: "middle", color: "#52514e" });
    if (P.key === "eta") {
      // legend: three horizons (ordered blue ramp)
      C.rows.forEach((r, i) => {
        const ly = m.t + 10 + i * 14;
        g.append("line").attr("x1", m.l + 8).attr("x2", m.l + 24).attr("y1", ly - 3.5).attr("y2", ly - 3.5).attr("stroke", cols[i]).attr("stroke-width", 2.2)
          .attr("stroke-linecap", "round");
        mathAt(m.l + 29, ly, `h=${r.h}`, { size: 8.8, color: "#52514e" });
      });
    } else {
      // the minima (in eta*kappa units) sit at nearly the same place
      const mins = C.rows.map(r => C.etas[r.curve.indexOf(d3.min(r.curve))] * r.kappa);
      const lo = d3.min(mins), hi = d3.max(mins);
      g.append("rect").attr("x", xs(lo) - 2).attr("y", m.t).attr("width", xs(hi) - xs(lo) + 4).attr("height", m.h)
        .attr("fill", css("--b100")).attr("opacity", 0.6).lower();
      g.select(".grid").lower();
      g.append("text").attr("class", "t-small").attr("x", xs(lo) - 6).attr("y", m.t + 12).attr("text-anchor", "end").text("minima align");
    }
  });
}
});
</script>
</body></html>
